services:
  - type: web
    name: timeline-studio
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: build
        sync: false
      - key: JWT_ACCESS_SECRET
        scope: build
        sync: false
      - key: JWT_REFRESH_SECRET
        scope: build
        sync: false
      - key: PORT
        value: 3000
      - key: COOKIE_SECURE
        value: "true"
