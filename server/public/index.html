<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Studio</title>
<style>
  :root{
    --tl-gutter:150px;
    --paper:#F3F6F9;
    --surface:#FFFFFF;
    --ink:#182430;
    --ink-soft:#57697A;
    --ink-faint:#9FB0BE;
    --line:#E1E8EE;
    --line-strong:#C9D4DD;
    --header:#003057;
    --header-soft:#0076BC;
    --accent:#0076BC;
    --accent-soft:#DCEEFB;
    --phase:#77787B;
    --phase-track:#E6E7E8;
    --task:#0076BC;
    --task-track:#D3E9F7;
    --milestone:#003057;
    --major:#0099D8;
    --danger:#C0392B;
    --danger-soft:#F7DAD5;
    --st-notstarted:#77787B;
    --st-notstarted-bar:#9AA3AC;
    --st-notstarted-track:#E6E7E8;
    --st-progress:#0076BC;
    --st-progress-track:#D3E9F7;
    --st-complete:#1B7A45;
    --st-complete-track:#D7EBDD;
    --st-risk:#C0392B;
    --st-risk-track:#F7DAD5;
    --st-behind:#D98324;
    --st-behind-track:#F6E3CC;
    --icon-teal:#1b6577;
    --font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SFMono-Regular', 'IBM Plex Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  .app{width:100%;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

  /* header bar */
  .topbar{background:var(--header);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .topbar-left{display:flex;align-items:baseline;gap:14px;min-width:0;flex:1 1 auto;}
  .mark{width:9px;height:26px;background:var(--accent);flex:0 0 auto;border-radius:1px;}
  .proj-title{font-family:var(--font-body);font-size:20px;font-weight:700;letter-spacing:.2px;background:transparent;border:none;color:#fff;outline:none;min-width:0;white-space:normal;word-break:break-word;border-bottom:1px solid transparent;padding:2px 0;cursor:text;}
  .proj-title:hover, .proj-title:focus{border-bottom:1px solid rgba(255,255,255,.35);}

  /* tab strip */
  .tabstrip{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap;}
  .tabs{display:flex;gap:4px;background:var(--paper);padding:3px;border-radius:8px;border:1px solid var(--line);}
  .tab-btn{border:none;background:transparent;padding:7px 18px;font-size:13.5px;font-weight:600;color:var(--ink-soft);border-radius:6px;cursor:pointer;font-family:var(--font-body);letter-spacing:.02em;}
  .tab-btn.active{background:var(--header);color:#fff;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar-sep{width:1px;height:22px;background:var(--line-strong);margin:0 2px;}
  .compact-pill{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-body);display:inline-flex;align-items:center;gap:6px;}
  .compact-pill:hover{border-color:rgba(255,255,255,.5);}
  .compact-pill.active{background:var(--accent);border-color:var(--accent);color:var(--header);}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body);display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--header);color:#fff;border-color:var(--header);}
  .btn.primary:hover{background:var(--header-soft);color:#fff;}

  /* ===== DATA VIEW ===== */
  .view{flex:1;overflow:auto;}
  .data-wrap{padding:0 12px 40px;}
  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line-strong);position:sticky;top:0;background:var(--paper);white-space:nowrap;}
  table.data td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr.hidden-row{opacity:.45;}
  tr.hidden-row input, tr.hidden-row select{font-style:italic;}
  .title-in{border:none;background:transparent;font-size:13.5px;width:100%;color:var(--ink);font-family:var(--font-body);padding:4px 2px;border-radius:4px;}
  .title-in:focus{background:var(--accent-soft);outline:none;}
  .type-pick{display:flex;align-items:center;gap:6px;}
  .type-icon{width:13px;height:13px;flex:0 0 auto;display:inline-block;}
  select.type-sel{border:1px solid var(--line);background:var(--surface);font-size:12px;border-radius:4px;padding:3px 4px;font-family:var(--font-body);color:var(--ink);}
  .dur{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  input.date-in{border:1px solid var(--line);background:var(--surface);font-size:12px;border-radius:4px;padding:3px 4px;font-family:var(--font-mono);color:var(--ink);width:100px;}
  input.pct-in{border:1px solid var(--line);background:var(--surface);font-size:12px;border-radius:4px;padding:4px 6px;font-family:var(--font-mono);width:52px;color:var(--ink);}
  input.assign-in{border:1px solid var(--line);background:var(--surface);font-size:12px;border-radius:4px;padding:4px 6px;font-family:var(--font-body);width:110px;color:var(--ink);}
  select.status-sel{border:none;font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 10px;font-family:var(--font-body);color:#fff;cursor:pointer;}
  .eye-btn,.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--ink-faint);font-size:14px;padding:4px;border-radius:4px;}
  .eye-btn:hover,.icon-btn:hover{color:var(--ink);background:var(--paper);}
  .icon-btn.del:hover{color:var(--danger);}
  .drag-cell{width:22px; padding:6px 0 6px 4px !important; cursor:grab;}
  .drag-handle{display:inline-flex; align-items:center; justify-content:center; width:16px; height:22px; border-radius:4px; color:var(--ink-faint);}
  .drag-handle:hover{color:var(--ink-soft); background:var(--paper);}
  .drag-handle svg{display:block;}
  tr.dragging{opacity:.4;}
  tr.drop-above{box-shadow: inset 0 2px 0 0 var(--danger);}
  tr.drop-below{box-shadow: inset 0 -2px 0 0 var(--danger);}
  .drag-ghost{position:fixed; top:-1000px; left:-1000px; background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; box-shadow:0 4px 10px rgba(20,20,30,.18); padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--ink); font-family:var(--font-body); pointer-events:none;}
  .add-row-line{padding:12px 10px 6px 34px;}
  .add-link{background:none;border:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--font-body);padding:4px 0;}
  .add-link:hover{text-decoration:underline;}
  .note-lbl{display:block;font-size:11px;color:var(--ink-faint);font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;}
  .note-lbl::before{content:"📝 ";}

  /* row menu */
  .menu-cell{position:relative;}
  .menu-trigger{border:none;background:transparent;cursor:pointer;color:var(--ink-faint);font-size:16px;padding:4px 6px;border-radius:4px;letter-spacing:-1px;}
  .menu-trigger:hover{color:var(--ink);background:var(--paper);}
  .row-menu{position:absolute;top:calc(100% + 2px);right:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 24px rgba(20,20,30,.14);z-index:50;min-width:190px;padding:6px;}
  .row-menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;font-size:12.5px;color:var(--ink);border-radius:5px;cursor:pointer;font-family:var(--font-body);}
  .row-menu button:hover{background:var(--accent-soft);}
  .row-menu button.danger:hover{background:var(--danger-soft);color:var(--danger);}
  .row-menu hr{border:none;border-top:1px solid var(--line);margin:5px 2px;}

  /* undo/redo */
  .hist-controls{display:flex;gap:4px;margin-right:4px;}
  .hist-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;}
  .hist-btn:hover:not(:disabled){background:rgba(255,255,255,.16);}
  .hist-btn:disabled{opacity:.3;cursor:default;}

  /* ===== TIMELINE VIEW ===== */
  .tl-wrap{padding:24px;}
  .tl-card{background:var(--surface);border-radius:10px;border:1px solid var(--line);padding:36px 40px 44px;position:relative;}
  .tl-title{font-family:var(--font-body);font-size:26px;font-weight:700;margin:0 0 34px;color:var(--ink);text-align:center;}
  .tl-today-label{position:absolute;top:-28px;text-align:center;transform:translateX(-50%);z-index:2;}
  .tl-today-label .lbl{font-size:11.5px;font-weight:700;color:var(--danger);white-space:nowrap;font-family:var(--font-body);}
  .tl-today-label .today-arrow{font-size:13px;color:var(--danger);line-height:1;}
  .tl-scale{position:relative;}
  .tl-years{background:var(--header-soft);border-radius:5px 5px 0 0;overflow:hidden;height:22px;position:relative;border-bottom:1px solid rgba(255,255,255,.16);}
  .tl-year-cell{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#D7DBE4;font-size:11px;font-weight:700;font-family:var(--font-body);letter-spacing:.07em;border-right:1px solid rgba(255,255,255,.16);white-space:nowrap;overflow:hidden;}
  .tl-months{background:var(--header);border-radius:0 0 5px 5px;overflow:hidden;height:36px;position:relative;}
  .tl-month-cell{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#EDEEF2;font-size:11.5px;font-weight:700;font-family:var(--font-body);letter-spacing:.03em;border-right:1px solid rgba(255,255,255,.16);white-space:nowrap;overflow:hidden;}
  .tl-year-lbl{position:absolute;top:8px;font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--accent);}
  .tl-body-wrap{position:relative;}
  .tl-vlines{position:absolute;top:0;bottom:0;right:var(--tl-gutter);pointer-events:none;z-index:0;}
  .tl-vline{position:absolute;top:0;bottom:0;width:14px;transform:translateX(-50%);background:rgba(20,25,35,.05);}
  .tl-vline.today{top:38px;width:2px;background:var(--danger);opacity:.55;}
  .tl-scale-row{display:flex;align-items:flex-start;}
  .tl-scale{flex:1;position:relative;min-width:0;margin-right:var(--tl-gutter);}
  .tl-milestone-lane{position:relative;}
  .tl-milestone-mark{position:absolute;top:0;text-align:center;transform:translateX(-50%);}
  .tl-milestone-mark.today-mark{color:var(--danger);}
  .tl-milestone-mark .lbl{font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;font-family:var(--font-body);margin-top:1px;line-height:1.2;}
  .tl-milestone-mark .dt{font-size:10px;color:var(--ink-soft);font-family:var(--font-body);white-space:nowrap;line-height:1.2;}
  .tl-milestone-mark svg{display:block;margin:0 auto;}
  .tl-milestone-mark .today-arrow{font-size:13px;color:var(--danger);line-height:1;}
  .tl-rows{margin-top:2px;position:relative;z-index:1;}
  .tl-card.compact .tl-rows{margin-top:0;}
  .tl-row{display:flex;align-items:center;height:40px;position:relative;}
  .tl-card.compact .tl-row{height:20px;}
  .tl-card.compact .tl-row-label{font-size:11.5px;}
  .tl-card.compact .tl-row-label.phase-lbl{font-size:13px;}
  .tl-card.compact .tl-bar-caption{font-size:10px;}
  .tl-row-label{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--ink);font-family:var(--font-body);display:flex;align-items:center;overflow:hidden;}
  .tl-row-label.phase-lbl{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--ink);}
  .tl-row-label .lbl-text{white-space:nowrap;flex:0 0 auto;padding-right:8px;}
  .tl-row-label .lbl-fill{flex:1 1 auto;min-width:6px;height:0;border-top:1px dashed var(--line-strong);margin-right:6px;align-self:center;}
  .tl-row-track{flex:1;position:relative;height:100%;margin-right:var(--tl-gutter);}
  .tl-row-connector{position:absolute;left:0;top:50%;height:0;border-top:1px dashed var(--line-strong);}
  .tl-bar-wrap{position:absolute;top:50%;transform:translateY(-50%);height:22px;}
  .tl-card.compact .tl-bar-wrap{height:13px;}
  .tl-bar-wrap.phase{height:32px;}
  .tl-bar-track{position:absolute;inset:0;border-radius:5px;}
  .tl-bar-fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px;}
  .tl-bar-caption{position:absolute;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--ink-soft);font-family:var(--font-body);white-space:nowrap;}
  .tl-bar-caption.left{right:calc(100% + 10px);text-align:right;font-style:italic;}
  .tl-bar-caption.right{left:calc(100% + 10px);}
  .tl-bar-label-inside{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:var(--font-body);font-size:14px;white-space:nowrap;}
  .legend{display:flex;gap:22px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center;}
  .legend-divider{width:1px;height:14px;background:var(--line-strong);}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);font-family:var(--font-body);}
  .empty-note{color:var(--ink-faint);font-size:13px;font-style:italic;padding:20px 0;}

  /* ===== VERSIONS TAB ===== */
  .ver-wrap{padding:8px 24px 48px;}
  .ver-project-item{display:flex;align-items:center;padding:12px 10px;border-radius:6px;margin-bottom:8px;border:1px solid transparent;transition:all 150ms;}
  .ver-project-item:hover{background:var(--accent-soft);border-color:var(--accent);}
  .ver-project-item.active{background:var(--accent-soft);border-color:var(--accent);font-weight:600;}
  .ver-group{margin-top:26px;}
  .ver-group:first-child{margin-top:6px;}
  .ver-group-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:6px 2px;}
  .ver-group-dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
  .ver-group-name{font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.01em;}
  .ver-group-count{font-size:12.5px;color:var(--ink-faint);font-weight:600;}
  .ver-group-line{flex:1;height:1px;background:var(--line);}
  .ver-group-caret{color:var(--ink-faint);font-size:11px;transition:transform .12s;}
  .ver-group-caret.collapsed{transform:rotate(-90deg);}
  .ver-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:16px;margin-top:14px;}
  .ver-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:visible;position:relative;transition:box-shadow .12s, border-color .12s;}
  .ver-card:hover{border-color:var(--line-strong);box-shadow:0 6px 18px rgba(20,20,30,.08);}
  .ver-card-strip{height:8px;}
  .ver-card-body{padding:14px 14px 12px;}
  .ver-card-title{font-family:var(--font-body);font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ver-card-meta{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);}
  .ver-card-stats{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);}
  .ver-stat{display:flex;align-items:center;gap:4px;}
  .ver-card-menu-cell{position:absolute;top:8px;right:8px;}
  .ver-empty{color:var(--ink-faint);font-size:13px;font-style:italic;padding:30px 4px;text-align:center;border:1px dashed var(--line-strong);border-radius:10px;margin-top:14px;}
  .ver-current-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:4px;}
  .ver-current-banner .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);}
  .ver-current-banner .name{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:2px;}

  /* ===== LANDING PAGE ===== */
  .landing-layout{display:flex;height:100%;min-height:calc(100vh - 60px);width:100%;}
  .landing-sidebar{width:220px;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;overflow-y:auto;flex-shrink:0;}
  .landing-main{flex:1;padding:20px 24px;overflow-y:auto;width:100%;max-width:100%;}
  .new-project-btn{display:flex;align-items:center;gap:8px;width:100%;border:2px dashed var(--line-strong);background:transparent;color:var(--ink-soft);padding:14px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;font-family:var(--font-body);margin-bottom:20px;transition:all 150ms;}
  .new-project-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .landing-section{margin-bottom:24px;}
  .landing-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:12px;padding:0 6px;}
  .landing-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;color:var(--ink-soft);font-size:13.5px;transition:all 150ms;}
  .landing-item:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .landing-item.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600;}
  .landing-item-count{margin-left:auto;font-size:12px;color:var(--ink-faint);font-weight:500;}
  .landing-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .landing-search{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:6px;font-size:13px;font-family:var(--font-body);color:var(--ink);}
  .landing-search::placeholder{color:var(--ink-faint);}
  .landing-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:20px;margin-top:20px;}
  .landing-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .project-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:all 150ms;display:flex;flex-direction:column;}
  .project-card:hover{border-color:var(--line-strong);box-shadow:0 6px 18px rgba(20,20,30,.08);}
  .project-card-preview{height:140px;background:linear-gradient(135deg, #E6E7E8 0%, #D3E9F7 100%);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-faint);position:relative;overflow:hidden;}
  .project-card-preview svg{width:80%;height:80%;opacity:.4;}
  .project-card-body{padding:14px;flex:1;display:flex;flex-direction:column;}
  .project-card-title{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 4px;line-height:1.3;}
  .project-card-meta{font-size:11px;color:var(--ink-faint);margin-bottom:8px;}
  .project-card-stats{display:flex;gap:10px;font-size:11px;color:var(--ink-soft);margin-top:auto;}
  .project-card-stat{display:flex;align-items:center;gap:4px;}
  .project-list-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;cursor:pointer;transition:all 150ms;display:flex;align-items:center;gap:20px;}
  .project-list-item:hover{border-color:var(--line-strong);box-shadow:0 4px 12px rgba(20,20,30,.06);}
  .project-list-item-preview{width:100px;height:70px;background:linear-gradient(135deg, #E6E7E8 0%, #D3E9F7 100%);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .project-list-item-preview svg{width:70%;height:70%;opacity:.3;}
  .project-list-item-content{flex:1;min-width:0;}
  .project-list-item-title{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .project-list-item-meta{font-size:12px;color:var(--ink-faint);display:flex;gap:16px;}
  .landing-empty{text-align:center;padding:60px 40px;color:var(--ink-faint);}
  .landing-empty-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .view-toggle{display:flex;gap:8px;align-items:center;}

<script>
/* ---------------- state ---------------- */
let uid = 100;
let projectTitle = "Untitled Project";
let activeTab = "data"; // data | timeline | versions | account
let openMenuKey = null; // "<slId>-<rowId>-<isPhase>" of currently open row menu
let dragSrc = null; // {slId, rowId, isPhase} of the row currently being dragged
let compactMode = false; // when true, halves the vertical spacing between timeline rows

/* Auth state */
let authUser = null; // {id, email, displayName} once logged in
let myProjects = []; // [{id, title, createdAt, updatedAt}] for picker
let currentProjectId = null; // currently open project
let projectDataCache = {}; // cache for project swimlanes data

/* API wrapper with auth */
async function apiFetch(path, opts={}, attemptCount=0){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 second timeout

  try {
    const res = await fetch(path, {
      ...opts,
      credentials:'include',
      signal: controller.signal,
      headers: { 'Content-Type':'application/json', ...(opts.headers||{}) }
    });
    clearTimeout(timeoutId);
    return handleAuthResponse(res, path, opts, attemptCount);
  } catch (err) {
    clearTimeout(timeoutId);
    if (err.name === 'AbortError') {
      throw new Error('Request timeout - server not responding');
    }
    throw err;
  }
}

async function handleAuthResponse(res, path, opts, attemptCount){

  if(res.status === 401 && attemptCount === 0 && path !== '/api/v1/auth/refresh'){
    // Try to refresh token only once
    try {
      const refreshRes = await fetch('/api/v1/auth/refresh', {
        method: 'POST',
        credentials:'include',
        headers: { 'Content-Type':'application/json' }
      });

      if(refreshRes && refreshRes.ok){
        // Token refreshed, retry original request (but only once)
        return await fetch(path, { ...opts, credentials:'include',
          headers: { 'Content-Type':'application/json', ...(opts.headers||{}) } });
      }
    } catch(e) {
      console.error('Token refresh error:', e);
    }
  }

  if(res.status === 401){
    // Refresh failed or already attempted, log out
    authUser = null;
    renderAuthScreen();
    return null;
  }

  return res;
}

/* ---------------- undo / redo history ---------------- */
let history = [];
let future = [];
function snapshot(){ return JSON.stringify({ swimlanes, projectTitle }); }
function pushHistory(){
  history.push(snapshot());
  if(history.length > 60) history.shift();
  future = [];
}
function restoreSnapshot(json){
  const obj = JSON.parse(json);
  swimlanes = obj.swimlanes;
  projectTitle = obj.projectTitle;
}
function undo(){
  if(history.length === 0) return;
  future.push(snapshot());
  restoreSnapshot(history.pop());
  saveFlash(); render();
}
function redo(){
  if(future.length === 0) return;
  history.push(snapshot());
  restoreSnapshot(future.pop());
  saveFlash(); render();
}

function parseD(s){ return new Date(s + "T00:00:00"); }
function fmtD(d){
  return (d.getMonth()+1) + "/" + String(d.getDate()).padStart(2,"0") + "/" + d.getFullYear();
}
function fmtShort(d){
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[d.getMonth()] + " " + d.getDate();
}
function durationLabel(startS, endS){
  const s = parseD(startS), e = parseD(endS);
  const rawDays = Math.round((e - s) / 86400000);
  if(rawDays <= 0) return "0 days";
  const days = rawDays + 1; // inclusive of both the start and end date
  if(days < 7) return days + (days===1 ? " day" : " days");
  const weeks = Math.round(days/7);
  return weeks + (weeks===1 ? " week" : " weeks");
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

    type: type,

function addSwimlane(){
  pushHistory();
  const id = ++uid;
  const start = todayISO();
  const e = new Date(); e.setDate(e.getDate()+28);
  const end = e.getFullYear()+"-"+String(e.getMonth()+1).padStart(2,"0")+"-"+String(e.getDate()).padStart(2,"0");

    children:[]
  });

}
function swimlaneBaseStart(sl){
  if(sl.phase) return sl.phase.start;
  if(sl.children && sl.children.length) return sl.children[0].start;
  return todayISO();
}
function addChild(swimlaneId, type){
  pushHistory();
  const sl = swimlanes.find(s=>s.id===swimlaneId);

  sl.children.push(blankChild(type, swimlaneBaseStart(sl)));

function calculatePlannedProgress(start, end){
  try{
    if(!start || !end) return 0;
    const startDate = new Date(start);
    const endDate = new Date(end);
    const today = new Date();

    if(isNaN(startDate.getTime()) || isNaN(endDate.getTime())) return 0;

    if(today <= startDate) return 0;
    if(today >= endDate) return 100;

    const totalDays = (endDate - startDate) / (1000 * 60 * 60 * 24);
    const elapsedDays = (today - startDate) / (1000 * 60 * 60 * 24);
    return Math.round((elapsedDays / totalDays) * 100);
  }catch(e){
    console.warn('[PLANNED_PROGRESS] Error:', e.message);
    return 0;
  }
}

function calculateScheduleVariance(actual, start, end){
  try{
    const planned = calculatePlannedProgress(start, end);
    return actual - planned;
  }catch(e){
    console.warn('[SCHEDULE_VARIANCE] Error:', e.message);
    return 0;
  }
}

function calculateTaskStatus(task){
  try{
    const actual = task.percent || 0;
    const planned = calculatePlannedProgress(task.start, task.end);

    if(task.title) console.log('[TASK_STATUS]', task.title, '| Actual:', actual + '%', '| Planned:', planned + '%');

    // Per skill point 7 - Task Status Rules:
    // 🟢 Complete: If Actual % = 100%
    if(actual === 100) return 'Complete';

    // ⚪ Not Started: If Actual % = 0% AND Start Date > Today
    if(actual === 0){
      const startDate = new Date(task.start);
      if(!isNaN(startDate.getTime()) && startDate > new Date()) return 'Not Started';
    }

    // 🟢 On Track: If Actual Progress >= Planned Progress - 10%
    if(actual >= planned - 10) return 'On Track';

    // 🟡 At Risk: If Actual Progress < Planned Progress - 10% but >= Planned Progress - 20%
    if(actual >= planned - 20) return 'At Risk';

    // 🔴 Off Track: If Actual Progress < Planned Progress - 20%
    return 'Off Track';
  }catch(e){
    console.warn('[TASK_STATUS] Error:', e.message);
    return 'On Track';
  }
}

function calculateProjectProgress(projectData){
  if(!projectData || !projectData.swimlanes || projectData.swimlanes.length === 0){
    console.log('[PROGRESS] No swimlanes found');
    return 0;
  }

  let totalPercent = 0;
  let taskCount = 0;

  // Iterate through all swimlanes and their tasks
  projectData.swimlanes.forEach(swimlane => {
    // Count the phase itself
    if(swimlane.phase){
      totalPercent += (swimlane.phase.percent || 0);
      taskCount++;
    }

    // Count all child tasks
    if(swimlane.children && swimlane.children.length > 0){
      swimlane.children.forEach(child => {
        totalPercent += (child.percent || 0);
        taskCount++;
      });
    }
  });

  const progress = taskCount > 0 ? Math.round(totalPercent / taskCount) : 0;
  console.log('[PROGRESS] Calculated progress:', progress, '| Tasks:', taskCount, '| Total %:', totalPercent);
  return progress;
}

function calculateProjectStatus(projectData){
  try{
    if(!projectData || !projectData.swimlanes || projectData.swimlanes.length === 0){
      return 'Not Started';
    }

    let taskVariances = [];

    projectData.swimlanes.forEach(swimlane => {
      try{
        if(swimlane.phase){
          const variance = calculateScheduleVariance(swimlane.phase.percent || 0, swimlane.phase.start, swimlane.phase.end);
          // Only consider if not complete
          if((swimlane.phase.percent || 0) < 100){
            taskVariances.push(variance);
          }
        }

        if(swimlane.children && swimlane.children.length > 0){
          swimlane.children.forEach(child => {
            const variance = calculateScheduleVariance(child.percent || 0, child.start, child.end);
            // Only consider if not complete
            if((child.percent || 0) < 100){
              taskVariances.push(variance);
            }
          });
        }
      }catch(e){
        console.warn('[PROJECT_STATUS] Error processing swimlane:', e.message);
      }
    });

    // If no in-progress tasks, project is complete
    if(taskVariances.length === 0){
      return 'Complete';
    }

    // Use worst (minimum) variance of in-progress tasks
    // This ensures that a significantly delayed task affects project status
    const worstVariance = Math.min(...taskVariances);
    console.log('[PROJECT_STATUS] In-progress tasks:', taskVariances.length, '| Worst variance:', worstVariance + '%');

    if(worstVariance >= -10) return 'On Track';
    if(worstVariance >= -20) return 'At Risk';
    return 'Off Track';
  }catch(e){
    console.warn('[PROJECT_STATUS] Error:', e.message);
    return 'On Track';
  }
}

    if(passwordInput.type === "password"){
      passwordInput.type = "text";
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
      passwordInput.type = "password";
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';

  };

  window.switchToLogin = ()=>{
    document.getElementById("authFormTitle").textContent = "Login";

  window.switchToRegister = ()=>{
    document.getElementById("authFormTitle").textContent = "New User Registration";
    document.getElementById("authNameField").style.display = "block";
    regBtn.style.display = "inline-flex";
    swReg.style.display = "none";
    logBtn.style.display = "none";
    swLog.style.display = "inline-flex";
  };

  window.handleRegister = async ()=>{
    const email = document.getElementById("authEmail").value;
    const password = document.getElementById("authPassword").value;
    const displayName = document.getElementById("authName").value;

    showAuthSpinner();

    try {
      const res = await apiFetch('/api/v1/auth/register', {
        method: 'POST',
        body: JSON.stringify({ email, password, displayName: displayName || undefined })
      });

      if(res && res.ok){
        const data = await res.json();
        authUser = data.user;
        await loadProjectList();
        currentProjectId = myProjects[0]?.id;
        if(!currentProjectId){
          const createRes = await apiFetch('/api/v1/projects', {
            method: 'POST',
            body: JSON.stringify({ title: 'My First Project' })
          });

            await loadProjectList();

            console.error('Failed to create first project:', createRes?.status);
            hideAuthSpinner();
            alert('Account created but could not create first project. Please try again.');
            return;

        await loadProjectList();
        renderDashboard();

        alert('Email already registered.');

        hideAuthSpinner();
        const errData = res ? await res.json() : {};
        alert('Registration failed: ' + (errData.detail || 'Unknown error'));
      }

      hideAuthSpinner();
      console.error('Registration error:', err);
      alert('Registration error: ' + err.message);

  window.handleLogin = async ()=>{
    const email = document.getElementById("authEmail").value;

    showAuthSpinner();

    try {
      const res = await apiFetch('/api/v1/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      if(res && res.ok){
        const data = await res.json();
        authUser = data.user;
        await loadProjectList();
        renderDashboard();
      } else {
        hideAuthSpinner();
        alert('Login failed. Please check your email/password.');

      hideAuthSpinner();
      console.error('Login error:', err);
      alert('Login error: ' + err.message);
    }
  };

  window.openForgotPasswordModal = ()=>{
    document.getElementById("forgotPasswordModal").style.display = "flex";
    document.getElementById("forgotPasswordStep1").style.display = "block";
    document.getElementById("forgotPasswordStep2").style.display = "none";
    document.getElementById("forgotPasswordSuccess").style.display = "none";
    document.getElementById("forgotPasswordEmail").value = "";
    document.getElementById("resetCode").value = "";
    document.getElementById("newPassword").value = "";
  };

  window.closeForgotPasswordModal = ()=>{
    document.getElementById("forgotPasswordModal").style.display = "none";
  };

  window.handleForgotPassword = async ()=>{
    const email = document.getElementById("forgotPasswordEmail").value.trim();
    const errorDiv = document.getElementById("forgotPasswordError");

    errorDiv.style.display = "none";
    errorDiv.textContent = "";

    if(!email){
      errorDiv.textContent = "Please enter your email address";
      errorDiv.style.display = "block";
      return;
    }

    if(!email.includes("@")){
      errorDiv.textContent = "Please enter a valid email address";
      errorDiv.style.display = "block";
      return;
    }

    document.getElementById("forgotPasswordStep1").style.display = "none";
    document.getElementById("forgotPasswordLoading").style.display = "block";

    try {
      const res = await apiFetch('/api/v1/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ email })
      });

      if(res && res.ok){
        const data = await res.json();
        console.log('[FORGOT PASSWORD]', data);

        document.getElementById("forgotPasswordLoading").style.display = "none";

        if(data.resetToken){
          alert("Reset Code: " + data.resetToken + "\n\n📧 Email not configured\n\nPaste this code in the next screen to reset your password");
        } else {
          alert("✓ Reset code sent to your email!\n\nCheck your inbox for the 6-digit code.");
        }
        document.getElementById("forgotPasswordStep2").style.display = "block";
      } else {
        document.getElementById("forgotPasswordLoading").style.display = "none";
        document.getElementById("forgotPasswordStep1").style.display = "block";
        const errorData = res ? await res.json() : {};
        errorDiv.textContent = errorData.detail || 'Failed to send reset code. Please try again.';
        errorDiv.style.display = "block";
        console.error('Forgot password error:', errorData);
      }
    } catch(err){
      document.getElementById("forgotPasswordLoading").style.display = "none";
      document.getElementById("forgotPasswordStep1").style.display = "block";
      errorDiv.textContent = 'Error: ' + err.message;
      errorDiv.style.display = "block";
      console.error('Forgot password error:', err);
    }
  };

  window.goBackForgotPassword = ()=>{
    document.getElementById("forgotPasswordStep1").style.display = "block";
    document.getElementById("forgotPasswordStep2").style.display = "none";
  };

  window.handleResetPassword = async ()=>{
    const email = document.getElementById("forgotPasswordEmail").value.trim();
    const resetToken = document.getElementById("resetCode").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const errorDiv = document.getElementById("resetPasswordError");

    errorDiv.style.display = "none";
    errorDiv.textContent = "";

    if(!resetToken || resetToken.length !== 6){
      errorDiv.textContent = "Please enter a valid 6-digit reset code";
      errorDiv.style.display = "block";
      return;
    }
    if(!newPassword){
      errorDiv.textContent = "Please enter a new password";
      errorDiv.style.display = "block";
      return;
    }

    if(newPassword.length < 8){
      errorDiv.textContent = "Password must be at least 8 characters";
      errorDiv.style.display = "block";
      return;
    }

    const resetBtn = document.getElementById("resetPasswordBtn");
    resetBtn.disabled = true;
    resetBtn.style.opacity = "0.6";

    try {
      const res = await apiFetch('/api/v1/auth/reset-password', {
        method: 'POST',
        body: JSON.stringify({ email, resetToken, newPassword })
      });

      if(res && res.ok){
        document.getElementById("forgotPasswordStep2").style.display = "none";
        document.getElementById("forgotPasswordSuccess").style.display = "block";
      } else if(res?.status === 401){
        resetBtn.disabled = false;
        resetBtn.style.opacity = "1";
        errorDiv.textContent = 'Invalid or expired reset code. Please try again.';
        errorDiv.style.display = "block";
      } else {
        resetBtn.disabled = false;
        resetBtn.style.opacity = "1";
        const errData = res ? await res.json() : {};
        errorDiv.textContent = 'Reset failed: ' + (errData.detail || 'Unknown error');
        errorDiv.style.display = "block";
        console.error('Reset password error:', errData);
      }
    } catch(err){
      resetBtn.disabled = false;
      resetBtn.style.opacity = "1";
      errorDiv.textContent = 'Error: ' + err.message;
      errorDiv.style.display = "block";
      console.error('Reset password error:', err);
    }
  };
}

function renderProjectPicker(){
  const app = document.getElementById("app");
  let projectCardsHtml = "";
  let projectListHtml = "";

  const svgTemplate = `<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" style="opacity:0.3;">
    <rect x="20" y="20" width="160" height="15" fill="#0076BC" rx="2"/>
    <rect x="20" y="50" width="160" height="12" fill="#0076BC" rx="2"/>
    <rect x="20" y="70" width="140" height="12" fill="#0076BC" rx="2"/>
    <rect x="20" y="90" width="130" height="12" fill="#0099D8" rx="2"/>
    <rect x="20" y="110" width="110" height="12" fill="#0099D8" rx="2"/>
  </svg>`;

  myProjects.forEach(proj => {
    const updated = new Date(proj.updatedAt);
    const month = updated.toLocaleString('default', { month: 'short' });
    const day = updated.getDate();
    const year = updated.getFullYear();
    const updatedStr = `${day} ${month}, ${year}`;

    // Card view
    projectCardsHtml += `
      <div class="project-card" onclick="openProject('${escapeAttr(proj.id)}')">
        <div class="project-card-preview">${svgTemplate}</div>
        <div class="project-card-body">
          <p class="project-card-title">${escapeHtml(proj.title)}</p>
          <div class="project-card-meta">Updated ${updatedStr}</div>
          <div class="project-card-stats">
            <span class="project-card-stat">📊 Timeline</span>
          </div>
        </div>
      </div>
    `;

    // List view
    projectListHtml += `
      <div class="project-list-item" onclick="openProject('${escapeAttr(proj.id)}')">
        <div class="project-list-item-preview">${svgTemplate}</div>
        <div class="project-list-item-content">
          <p class="project-list-item-title">${escapeHtml(proj.title)}</p>
          <div class="project-list-item-meta">
            <span>Updated ${updatedStr}</span>
          </div>
        </div>
      </div>
    `;
  });

  const viewContent = projectCardsHtml || projectListHtml ? `
    <div class="landing-header">
      <h1 style="margin:0;font-size:24px;font-weight:700;">All Projects</h1>
      <input type="text" class="landing-search" placeholder="Search projects..." id="landingSearch" oninput="filterProjectCards(this.value)"/>
    </div>
    <div class="landing-list">${projectListHtml}</div>
  ` : `
    <div class="landing-empty">
      <div class="landing-empty-title">No projects yet</div>
      <p>Create your first project to get started building timelines</p>
      <button class="btn primary" onclick="createNewProject()" style="margin-top:20px;">+ Create Project</button>
    </div>
  `;

  app.innerHTML = `
    <div class="app">
      <div class="topbar">
        <div style="flex:1;"></div>
        <div style="display:flex;gap:12px;align-items:center;">
          <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.2);" onclick="logout()">Log Out</button>
        </div>
      </div>

      <div class="landing-layout">
        <div class="landing-sidebar">
          <button class="new-project-btn" onclick="createNewProject()">
            <span>+</span> New Project
          </button>

          <div class="landing-section">
            <div class="landing-section-title">My Projects</div>
            <div class="landing-item active">
              <span>📁 All Projects</span>
              <span class="landing-item-count">${myProjects.length}</span>
            </div>
          </div>
        </div>

        <div class="landing-main">
          ${viewContent}
        </div>
      </div>
    </div>
  `;

  window.createNewProject = async ()=>{
    const title = prompt("Project name:", "New Project");
    if(!title) return;
    const res = await apiFetch('/api/v1/projects', {
      method: 'POST',
      body: JSON.stringify({ title })
    });
    if(res && res.ok){
      await loadProjectList();
      renderProjectPicker();
    }
  };

  window.deleteProject = async (projId)=>{
    if(!confirm("Delete this project? This cannot be undone.")) return;
    const res = await apiFetch(`/api/v1/projects/${projId}`, { method: 'DELETE' });
    if(res && res.status === 204){
      await loadProjectList();
      renderProjectPicker();
    }
  };
}

function filterProjectCards(query){
  const cards = document.querySelectorAll('.project-card, .project-list-item');
  const lowerQuery = query.toLowerCase();
  cards.forEach(card => {
    const title = card.querySelector('.project-card-title, .project-list-item-title')?.textContent.toLowerCase() || '';
    card.style.display = title.includes(lowerQuery) ? '' : 'none';
  });
}

  allMenus.forEach(m => {

async function saveProjectChanges(){
  const projectId = document.getElementById('editProjectId').value;
  const projectName = document.getElementById('editProjectName').value;

  console.log('[SAVE] Starting save for project:', projectId, 'Name:', projectName);

  if(!projectName.trim()){
    alert('Project name is required');
    return;
  }

  const saveBtn = document.querySelector('.dashboard-modal-btn.primary');
  if(saveBtn){
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
  }

  try{
    const payload = {
      projectTitle: projectName,
      swimlanes: []
    };
    console.log('[SAVE] Sending payload:', payload);

    const res = await apiFetch(`/api/v1/projects/${projectId}`, {
      method: 'PUT',
      body: JSON.stringify(payload)
    });

    console.log('[SAVE] Response status:', res?.status);
    console.log('[SAVE] Response ok:', res?.ok);

    if(res && res.ok){
      console.log('[SAVE] Project saved successfully');

      // Reload project list and refresh dashboard
      console.log('[SAVE] Loading project list...');
      await loadProjectList();
      console.log('[SAVE] Projects loaded:', myProjects);

      console.log('[SAVE] Rendering dashboard...');
      renderDashboard();
      console.log('[SAVE] Dashboard rendered');

      closeEditProjectModal();

      // Show success message
      alert('✓ Project updated successfully!');
    } else {
      const errorData = res ? await res.json() : {};
      console.error('[SAVE] API Error:', errorData);
      alert('Failed to update project: ' + (errorData.detail || 'Unknown error'));
      if(saveBtn){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    }
  } catch(err){
    console.error('[SAVE] Exception:', err);
    alert('Error: ' + err.message);
    if(saveBtn){
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    }
  }
}

const GROUP_PALETTE = ["#0076BC","#1B7A45","#D98324","#77787B","#8E44AD","#C0392B","#0099D8","#B7950B"];
function groupColor(name){
  let h = 0;
  const s = name || "Ungrouped";
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return GROUP_PALETTE[h % GROUP_PALETTE.length];
}
function fmtSavedAt(iso){
  const d = new Date(iso);
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function versionStats(data){
  let tasks=0, milestones=0, phases=data.swimlanes.length;
  data.swimlanes.forEach(sl=> sl.children.forEach(c=>{
    if(c.type==="milestone" || c.type==="major") milestones++; else tasks++;
  }));
  return {phases, tasks, milestones};
}
function toggleGroupCollapse(name){
  if(collapsedGroups.has(name)) collapsedGroups.delete(name); else collapsedGroups.add(name);
  render();
}
function toggleVersionMenu(id){
  versionMenuKey = (versionMenuKey===id) ? null : id;
  render();

async function deleteBulkVersions(){
  if(selectedVersions.size === 0){
    alert("No versions selected");
    return;
  }

  const totalToDelete = selectedVersions.size;
  if(!confirm(`Delete ${totalToDelete} version${totalToDelete === 1 ? '' : 's'}? This cannot be undone.`)){
    return;
  }

  let deleted = 0;
  for(const versionId of selectedVersions){
    try {
      console.log(`[DELETE] Attempting to delete version ${versionId}`);
      const res = await apiFetch(`/api/v1/projects/${currentProjectId}/versions/${versionId}`, {
        method: 'DELETE'
      });
      console.log(`[DELETE] Response:`, res, `Status:`, res?.status, `OK:`, res?.ok);
      if(res && (res.status === 204 || res.ok)){
        deleted++;
        console.log(`[DELETE] ✓ Deleted version ${versionId}`);
      } else {
        console.error(`[DELETE] ✗ Failed to delete version ${versionId}. Status:`, res?.status);
      }
    } catch(err){
      console.error("[DELETE] Exception:", err);
    }
  }

  selectedVersions.clear();
  await loadVersions();
  alert(`Deleted ${deleted}/${totalToDelete} version${deleted === 1 ? '' : 's'}`);
  render();
}

async function loadVersion(id){
  const v = versions.find(x=>x.id===id);
  if(!v) return;
  if(!confirm(`Open "${v.name}"? Any unsaved changes to the current timeline will be replaced (use Undo to recover).`)) return;
  const res = await apiFetch(`/api/v1/projects/${currentProjectId}/versions/${id}/restore`, {
    method: 'POST'
  });
  if(res && res.ok){
    const data = await res.json();
    pushHistory();
    swimlanes = data.swimlanes;
    projectTitle = data.projectTitle;
    versionMenuKey = null;
    activeTab = "data";
    render();
  }
}
async function duplicateVersion(id){
  const v = versions.find(x=>x.id===id);
  if(!v) return;
  const res = await apiFetch(`/api/v1/projects/${currentProjectId}/versions/${id}`);
  if(res && res.ok){
    const versionData = await res.json();
    const createRes = await apiFetch(`/api/v1/projects/${currentProjectId}/versions`, {
      method: 'POST',
      body: JSON.stringify({ name: versionData.name + " (copy)", group: versionData.group })
    });
    versionMenuKey = null;
    if(createRes && createRes.ok) await loadVersions();
    render();
  }
}
async function updateVersionWithCurrent(id){
  const v = versions.find(x=>x.id===id);
  if(!v) return;
  if(!confirm(`Overwrite "${v.name}" with the timeline currently open in the editor?`)) return;
  const res = await apiFetch(`/api/v1/projects/${currentProjectId}/versions/${id}/overwrite-with-current`, {
    method: 'POST'
  });
  versionMenuKey = null;
  if(res && res.ok) await loadVersions();
  render();
}
async function deleteVersion(id){
  const v = versions.find(x=>x.id===id);
  if(!v) return;
  if(!confirm(`Delete "${v.name}"? This can't be undone.`)) return;
  const res = await apiFetch(`/api/v1/projects/${currentProjectId}/versions/${id}`, {
    method: 'DELETE'
  });
  versionMenuKey = null;
  if(res && res.status === 204) await loadVersions();
  render();
}

async function handleManualImport(){
  const statusDiv = document.getElementById("importStatus");
  const pasteArea = document.getElementById("importPasteArea");
  const pasted = pasteArea.value.trim();

  if(!pasted){
    statusDiv.textContent = "Please paste the data first";
    statusDiv.style.color = "var(--danger)";
    return;
  }

  let versions;
  try {
    versions = JSON.parse(pasted);
  } catch(e){
    statusDiv.textContent = "Invalid data format. Make sure you copied the correct text.";
    statusDiv.style.color = "var(--danger)";
    console.error("Parse error:", e);
    return;
  }

  if(!Array.isArray(versions) || versions.length === 0){
    statusDiv.textContent = "No versions found in pasted data";
    statusDiv.style.color = "var(--danger)";
    return;
  }

  if(confirm(`Import ${versions.length} version${versions.length === 1 ? '' : 's'}? This will create a new project with your timeline data.`)){
    await importTimelineData(versions);
    pasteArea.value = "";
  }
}

async function importTimelineData(versions){
  const statusDiv = document.getElementById("importStatus");
  statusDiv.textContent = "Importing...";
  statusDiv.style.color = "var(--ink-soft)";

  try {
    // Get the first version's data as the project title and swimlanes
    const firstVersion = versions[0];
    const projectTitle = firstVersion.data?.projectTitle || "Imported Timeline";
    let initialSwimlanes = firstVersion.data?.swimlanes || [];

    // Ensure all items are visible
    initialSwimlanes = initialSwimlanes.map(swimlane => ({
      ...swimlane,
      visible: true,
      children: (swimlane.children || []).map(child => ({ ...child, visible: true }))
    }));

    // Create new project with initial data
    const createRes = await apiFetch('/api/v1/projects', {
      method: 'POST',
      body: JSON.stringify({ title: projectTitle })
    });

    if(!createRes || !createRes.ok){
      statusDiv.style.color = "var(--danger)";
      statusDiv.textContent = "Failed to create project";
      return;
    }

    const newProject = await createRes.json();
    const projectId = newProject.id;

    // Update project with the first version's swimlanes
    await apiFetch(`/api/v1/projects/${projectId}`, {
      method: 'PUT',
      body: JSON.stringify({
        swimlanes: initialSwimlanes,
        projectTitle
      })
    }).catch(e => console.warn("Failed to set initial project data:", e));

    // Import each version as a saved snapshot
    let imported = 0;
    for(const version of versions){
      try {
        // Ensure all items are visible in each version too
        let versionSwimlanes = version.data?.swimlanes || [];
        versionSwimlanes = versionSwimlanes.map(swimlane => ({
          ...swimlane,
          visible: true,
          children: (swimlane.children || []).map(child => ({ ...child, visible: true }))
        }));

        const versionRes = await apiFetch(`/api/v1/projects/${projectId}/versions`, {
          method: 'POST',
          body: JSON.stringify({
            name: version.name || "Version " + (imported + 1),
            group: version.group || "Imported",
            data: { swimlanes: versionSwimlanes, projectTitle: version.data?.projectTitle || "Untitled" }
          })
        });

        if(versionRes && versionRes.ok){
          imported++;
        }
      } catch(err){
        console.warn("Failed to import one version:", err);
      }
    }

    statusDiv.style.color = "var(--st-complete)";
    statusDiv.textContent = `✓ Imported ${imported} version${imported === 1 ? '' : 's'}! Reloading...`;

    await new Promise(r => setTimeout(r, 1500));
    currentProjectId = projectId;
    await loadProjectList();
    await openProject(projectId);
    activeTab = "data";
    render();
  } catch(err){
    console.error("Import error:", err);
    statusDiv.style.color = "var(--danger)";
    statusDiv.textContent = "Error during import: " + err.message;
  }
}

          <input id="modalNameInput" type="text" value="${escapeAttr(modalName)}" oninput="updateModalName(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); confirmModal();}"/>
        </div>
        <div class="modal-field">
          <label>Business group</label>
          <input type="text" list="groupList" value="${escapeAttr(modalGroup)}" placeholder="e.g. Commission Systems, Credit Services..." oninput="updateModalGroup(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); confirmModal();}"/>
          <datalist id="groupList">${dl}</datalist>
          <div class="modal-hint">Pick an existing group or type a new one — versions are organized by this on the Versions tab.</div>
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn primary" onclick="confirmModal()">${isEdit ? "Save changes" : "Save version"}</button>
        </div>
      </div>
    </div>`;
}

    const p = sl.phase;
    if(p) rowsHtml += swimlaneHeaderRow(sl, p);
    sl.children.forEach(c=> rowsHtml += childRow(sl, c));
  });

  view.innerHTML = `
    <div class="data-wrap">
      <table class="data">

          <tr>
            <th class="drag-cell"></th>

            <th style="width:70px">Duration</th>
            <th style="width:110px">Start</th>
            <th style="width:110px">End</th>
            <th style="width:50px">%</th>
            <th style="width:100px">Assigned to</th>
            <th style="width:110px">Status</th>

            <th style="width:28px"></th>

function typeIconSvg(type, color){
  if(type==="phase") return `<svg class="type-icon" viewBox="0 0 14 14"><rect x="1" y="4" width="12" height="6" rx="1" fill="${color}"/></svg>`;
  if(type==="task") return `<svg class="type-icon" viewBox="0 0 14 14"><rect x="1" y="4" width="12" height="6" rx="1" fill="${color}"/></svg>`;
  if(type==="milestone") return `<svg class="type-icon" viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" fill="${color}" transform="rotate(45 7 7)"/></svg>`;
  if(type==="major") return `<svg class="type-icon" viewBox="0 0 14 14"><polygon points="7,1 8.7,5.1 13,5.4 9.7,8.2 10.8,12.5 7,10.1 3.2,12.5 4.3,8.2 1,5.4 5.3,5.1" fill="${color}"/></svg>`;
  return "";
}
function typeColor(type){
  return type==="phase" ? "var(--phase)" : type==="task" ? "var(--task)" : type==="milestone" ? "var(--milestone)" : "var(--major)";
}
function findRow(slId, rowId, isPhase){
  const sl = swimlanes.find(s=>s.id===slId);
  if(!sl) return null;
  return isPhase ? sl.phase : sl.children.find(c=>c.id===rowId);
}
function onTypeChange(slId, rowId, isPhase, val){
  const row = findRow(slId, rowId, isPhase);
  if(row){ pushHistory(); row.type = val; saveFlash(); render(); }
}
function onStatusChange(slId, rowId, isPhase, val){
  const row = findRow(slId, rowId, isPhase);
  if(row){ pushHistory(); row.status = val; saveFlash(); render(); }
}

function typeSelect(row, slId, rowId, isPhase){
  const opts = [["phase","Phase"],["task","Task"],["milestone","Milestone"],["major","Major Milestone"]];
  return `<select class="type-sel" onchange="onTypeChange(${slId}, ${rowId}, ${isPhase}, this.value)">
    ${opts.map(([v,l])=>`<option value="${v}" ${row.type===v?"selected":""}>${l}</option>`).join("")}
  </select>`;
}
function statusSelect(row, slId, rowId, isPhase){
  // Calculate status instead of using stored value
  const calculatedStatus = calculateTaskStatus(row);

  // Map calculated status to STATUS_META keys
  const statusMap = {
    'Complete': 'complete',
    'On Track': 'on-track',
    'At Risk': 'at-risk',
    'Off Track': 'off-track',
    'Not Started': 'not-started'
  };

  const statusKey = statusMap[calculatedStatus] || 'not-started';
  const color = STATUS_META[statusKey]?.color || 'var(--st-notstarted)';

  return `<select class="status-sel" style="background:${color}" onchange="onStatusChange(${slId}, ${rowId}, ${isPhase}, this.value)" title="Auto-calculated based on progress">
    ${Object.entries(STATUS_META).map(([k,m])=>`<option value="${k}" ${statusKey===k?"selected":""}>${m.label}</option>`).join("")}
  </select>`;
}

function rowMenuHtml(slId, rowId, isPhase, row){
  const key = menuKey(slId, rowId, isPhase);
  if(openMenuKey !== key) return "";
  return `<div class="row-menu">
    <button onclick="addRowRelative(${slId}, ${rowId}, ${isPhase}, 'above')">⬆ Add row above</button>
    <button onclick="addRowRelative(${slId}, ${rowId}, ${isPhase}, 'below')">⬇ Add row below</button>
    <button onclick="duplicateRow(${slId}, ${rowId}, ${isPhase})">⧉ Duplicate</button>

    <hr/>

  </div>`;
}
function noteHtml(row){
  return row.note ? `<span class="note-lbl" title="${escapeAttr(row.note)}">${escapeAttr(row.note)}</span>` : "";
}
function menuCell(slId, rowId, isPhase, row){
  return `<td class="menu-cell">
    <button class="menu-trigger" onclick="event.stopPropagation(); toggleMenu(${slId}, ${rowId}, ${isPhase})" title="More options">⋯</button>
    ${rowMenuHtml(slId, rowId, isPhase, row)}
  </td>`;
}

function dragHandleSvg(){
  return `<svg width="10" height="16" viewBox="0 0 10 16"><circle cx="2.5" cy="2.5" r="1.4" fill="currentColor"/><circle cx="7.5" cy="2.5" r="1.4" fill="currentColor"/><circle cx="2.5" cy="8" r="1.4" fill="currentColor"/><circle cx="7.5" cy="8" r="1.4" fill="currentColor"/><circle cx="2.5" cy="13.5" r="1.4" fill="currentColor"/><circle cx="7.5" cy="13.5" r="1.4" fill="currentColor"/></svg>`;
}
function dragCell(slId, rowId, isPhase){
  return `<td class="drag-cell" draggable="true"
      ondragstart="onRowDragStart(event, ${slId}, ${rowId}, ${isPhase})"
      ondragend="onRowDragEnd(event)">
      <span class="drag-handle">${dragHandleSvg()}</span>
    </td>`;
}
function onRowDragStart(e, slId, rowId, isPhase){
  dragSrc = { slId, rowId, isPhase };
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", String(rowId)); }catch(err){}
  const ghost = document.getElementById("dragGhost");
  if(ghost) e.dataTransfer.setDragImage(ghost, 14, 16);
  const tr = e.target.closest("tr");
  if(tr) setTimeout(()=> tr.classList.add("dragging"), 0);
}
function onRowDragOver(e, slId, rowId, isPhase){
  if(!dragSrc) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  const tr = e.currentTarget;
  const rect = tr.getBoundingClientRect();
  const isAfter = (e.clientY - rect.top) > rect.height/2;
  document.querySelectorAll("table.data tbody tr").forEach(r=>{ r.classList.remove("drop-above","drop-below"); });
  tr.classList.add(isAfter ? "drop-below" : "drop-above");
}
function onRowDrop(e, slId, rowId, isPhase){
  e.preventDefault();
  if(!dragSrc) return;
  const tr = e.currentTarget;
  const rect = tr.getBoundingClientRect();
  const isAfter = (e.clientY - rect.top) > rect.height/2;
  moveRow(dragSrc, { slId, rowId, isPhase }, isAfter);
  dragSrc = null;
  render();
}
function onRowDragEnd(e){
  dragSrc = null;
  document.querySelectorAll("table.data tbody tr").forEach(r=>{ r.classList.remove("drop-above","drop-below","dragging"); });
}
function moveRow(src, target, after){
  if(src.slId===target.slId && src.rowId===target.rowId && src.isPhase===target.isPhase) return;

  if(src.isPhase){
    // dragging an entire swimlane (its header + all its children) — reposition it
    // relative to whichever swimlane owns the row it was dropped on, whether that
    // row is another header or one of that swimlane's tasks/milestones.
    if(src.slId===target.slId) return; // dropped on its own header/children — no-op
    const fromIdx = swimlanes.findIndex(s=>s.id===src.slId);
    if(fromIdx===-1) return;
    pushHistory();
    const [moved] = swimlanes.splice(fromIdx,1);
    let toIdx = swimlanes.findIndex(s=>s.id===target.slId);
    if(toIdx===-1) toIdx = swimlanes.length;
    swimlanes.splice(after ? toIdx+1 : toIdx, 0, moved);
    saveFlash();
    return;
  }

  if(target.isPhase){
    // dragging a task/milestone onto a (different) swimlane's header — move it
    // into that swimlane, at the start or end depending on drop position.
    const srcSl = swimlanes.find(s=>s.id===src.slId);
    const tgtSl = swimlanes.find(s=>s.id===target.slId);
    if(!srcSl || !tgtSl) return;
    const fromIdx = srcSl.children.findIndex(c=>c.id===src.rowId);
    if(fromIdx===-1) return;
    pushHistory();
    const [moved] = srcSl.children.splice(fromIdx,1);
    tgtSl.children.splice(after ? tgtSl.children.length : 0, 0, moved);
    saveFlash();
    return;
  }

  // both are child rows — reorder within/into a swimlane's children list
  const srcSl = swimlanes.find(s=>s.id===src.slId);
  const tgtSl = swimlanes.find(s=>s.id===target.slId);
  if(!srcSl || !tgtSl) return;
  const fromIdx = srcSl.children.findIndex(c=>c.id===src.rowId);
  if(fromIdx===-1) return;
  pushHistory();
  const [moved] = srcSl.children.splice(fromIdx,1);
  let toIdx = tgtSl.children.findIndex(c=>c.id===target.rowId);
  if(toIdx===-1) toIdx = tgtSl.children.length;
  tgtSl.children.splice(after ? toIdx+1 : toIdx, 0, moved);
  saveFlash();
}

function swimlaneHeaderRow(sl, p){

function childRow(sl, c){

/* ---------------- rendering: TIMELINE TAB ---------------- */
function renderTimelineOnly(){
  if(activeTab==="timeline") renderTimeline();
}
function renderTimeline(){
  const view = document.getElementById("view");
  const rows = allRows().filter(r=>r.row.visible);

  if(rows.length===0){
    view.innerHTML = `<div class="tl-wrap"><div class="tl-card"><p class="empty-note">No visible items yet — toggle the eye icon on the Data tab to show items on the timeline.</p></div></div>`;
    return;
  }

  let minDate=null, maxDate=null;
  rows.forEach(r=>{
    const s = parseD(r.row.start), e = parseD(r.row.end);
    if(!minDate || s<minDate) minDate=s;
    if(!maxDate || e>maxDate) maxDate=e;
  });
  const rangeStart = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  const rangeEnd = new Date(maxDate.getFullYear(), maxDate.getMonth()+1, 0);
  const totalMs = rangeEnd - rangeStart;

  // month cells
  const months = [];
  let cur = new Date(rangeStart);
  while(cur <= rangeEnd){
    months.push(new Date(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function pctOf(date){
    return Math.max(0, Math.min(100, ((date - rangeStart)/totalMs)*100));
  }

  // month header cells — positioned by the same date-percentage math as the
  // bars/vlines below, so a given calendar date lines up vertically no matter
  // how many days are in each month.
  const monthCellsHtml = months.map(m=>{
    const mEndRaw = new Date(m.getFullYear(), m.getMonth()+1, 0);
    const mEndExclusive = new Date(mEndRaw.getFullYear(), mEndRaw.getMonth(), mEndRaw.getDate()+1);
    const x0 = pctOf(m);
    const x1 = pctOf(mEndExclusive);
    const w = Math.max(0, x1-x0);
    return `<div class="tl-month-cell" style="left:${x0}%; width:${w}%;">${monthNames[m.getMonth()]}</div>`;
  }).join("");

  // year header cells — one lighter band above the month bar, grouping the
  // months that fall in each calendar year
  const yearGroups = [];
  months.forEach(m=>{
    const y = m.getFullYear();
    const lastGroup = yearGroups[yearGroups.length-1];
    if(lastGroup && lastGroup.year===y){ lastGroup.months.push(m); }
    else { yearGroups.push({ year:y, months:[m] }); }
  });
  const yearCellsHtml = yearGroups.map(g=>{
    const firstM = g.months[0];
    const lastM = g.months[g.months.length-1];
    const lastMEndRaw = new Date(lastM.getFullYear(), lastM.getMonth()+1, 0);
    const lastMEndExclusive = new Date(lastMEndRaw.getFullYear(), lastMEndRaw.getMonth(), lastMEndRaw.getDate()+1);
    const x0 = pctOf(firstM);
    const x1 = pctOf(lastMEndExclusive);
    const w = Math.max(0, x1-x0);
    return `<div class="tl-year-cell" style="left:${x0}%; width:${w}%;">${g.year}</div>`;
  }).join("");

  // dynamic label column — measured to the longest visible row title's actual
  // rendered pixel width (not a character-count guess), so short titles don't
  // leave a big dead gap before the connector line/bar start
  const barRowsForWidth = rows.filter(r=> r.row.type==="phase" || r.row.type==="task");
  const rowFontPx = compactMode ? 11.5 : 13;
  const phaseFontPx = compactMode ? 13 : 15;
  const FONT_STACK = `-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif`;
  function measureLabelWidth(text, bold, sizePx){
    const canvas = measureLabelWidth._c || (measureLabelWidth._c = document.createElement("canvas"));
    const ctx = canvas.getContext("2d");
    ctx.font = `${bold?"700":"600"} ${sizePx}px ${FONT_STACK}`;
    return ctx.measureText(String(text)).width;
  }
  const maxLabelTextPx = Math.max(60, ...barRowsForWidth.map(r=>{
    const isPhaseRow = r.row.type==="phase";
    return measureLabelWidth(r.row.title, isPhaseRow, isPhaseRow?phaseFontPx:rowFontPx);
  }));
  const labelColPx = Math.round(Math.max(110, maxLabelTextPx + 34));

  // milestone markers (collect, then stagger overlapping ones using real pixel-width
  // collision boxes — so labels never visually overlap regardless of how tightly
  // two milestone dates fall together)
  const milestoneRows = rows.filter(r=> r.row.type==="milestone" || r.row.type==="major");
  const sortedM = milestoneRows.slice().sort((a,b)=>parseD(a.row.start)-parseD(b.row.start));
  const approxTrackWidthPx = 900; // conservative estimate of the chart's plotted width
  const levelRightEdgePct = [];
  let maxLevel = 0;
  const LEVEL_GAP = 42;
  const markerHtml = sortedM.map(r=>{
    const d = parseD(r.row.start);
    const p = pctOf(d);
    const dateStr = fmtShort(d);
    const labelPxWidth = Math.max(String(r.row.title).length, dateStr.length) * 6.4 + 16;
    const halfPct = (labelPxWidth/2) / approxTrackWidthPx * 100;
    let level = 0;
    while(levelRightEdgePct[level] !== undefined && (p - halfPct) < levelRightEdgePct[level] + 1){
      level++;
    }
    levelRightEdgePct[level] = p + halfPct;
    maxLevel = Math.max(maxLevel, level);
    const topOffset = level*LEVEL_GAP;
    const color = r.row.type==="major" ? "var(--major)" : "var(--milestone)";
    const shape = r.row.type==="major"
      ? `<svg width="16" height="16" viewBox="0 0 14 14"><polygon points="7,1 8.7,5.1 13,5.4 9.7,8.2 10.8,12.5 7,10.1 3.2,12.5 4.3,8.2 1,5.4 5.3,5.1" fill="${color}"/></svg>`
      : `<svg width="14" height="14" viewBox="0 0 14 14"><rect x="3" y="3" width="8" height="8" fill="${color}" transform="rotate(45 7 7)"/></svg>`;
    return `<div class="tl-milestone-mark" style="left:${p}%; top:${topOffset}px;">
      ${shape}
      <div class="dt">${fmtShort(d)}</div>
      <div class="lbl">${escapeAttr(r.row.title)}</div>
    </div>`;
  }).join("");
  const milestoneLaneHeight = 42 + maxLevel*LEVEL_GAP + 2;

  // today marker — rendered in the same lane as milestones so it touches the bar too
  const today = new Date();
  let todayMarkerHtml = "", todayVlineHtml = "";
  if(today>=rangeStart && today<=rangeEnd){
    const p = pctOf(today);
    todayMarkerHtml = `<div class="tl-today-label" style="left:${p}%;">
      <div class="lbl">Today</div>
      <div class="today-arrow">▼</div>
    </div>`;
    todayVlineHtml = `<div class="tl-vline today" style="left:${p}%;"></div>`;
  }

  // task/phase rows (non milestone)
  const barRows = barRowsForWidth;
  const rowsHtml = barRows.map(r=>{
    const row=r.row;
    const s=parseD(row.start), e=parseD(row.end);
    const left = pctOf(s), right = pctOf(e);
    const width = Math.max(right-left, 0.6);
    const isPhase = row.type==="phase";

    // Calculate status dynamically instead of using stored value
    let statusKey = "not-started";
    if(!isPhase){
      const calculatedStatus = calculateTaskStatus(row);
      const statusMap = {
        'Complete': 'complete',
        'On Track': 'on-track',
        'At Risk': 'at-risk',
        'Off Track': 'off-track',
        'Not Started': 'not-started'
      };
      statusKey = statusMap[calculatedStatus] || 'not-started';
    }

    const meta = STATUS_META[statusKey] || STATUS_META["not-started"];
    const barColor = isPhase ? "var(--phase)" : meta.bar;
    const trackColor = isPhase ? "var(--phase-track)" : meta.track;
    const fillPct = Math.max(0, Math.min(100, row.percent||0));
    return `<div class="tl-row">
      <div class="tl-row-label ${isPhase?"phase-lbl":""}" style="width:${labelColPx}px; flex:0 0 ${labelColPx}px;">
        <span class="lbl-text">${escapeAttr(row.title)}</span><span class="lbl-fill"></span>
      </div>
      <div class="tl-row-track">
        <div class="tl-row-connector" style="width:${left}%;"></div>
        <div class="tl-bar-wrap ${isPhase?"phase":""}" style="left:${left}%; width:${width}%;">
          <div class="tl-bar-track" style="background:${trackColor};"></div>
          <div class="tl-bar-fill" style="width:${fillPct}%; background:${barColor};"></div>
          ${isPhase ? `<div class="tl-bar-label-inside" style="color:#fff;">${escapeAttr(row.title)}</div>` : ""}
          <div class="tl-bar-caption left">${durationLabel(row.start,row.end)}</div>
          <div class="tl-bar-caption right">${fmtShort(s)} – ${fmtShort(e)}</div>
        </div>
      </div>
    </div>`;
  }).join("");

  view.innerHTML = `
    <div class="tl-wrap">
      <div class="tl-card ${compactMode?'compact':''}">
        <h1 class="tl-title">${escapeAttr(projectTitle)}</h1>
        <div class="tl-body-wrap">
          <div class="tl-vlines" style="left:${labelColPx}px;">${todayVlineHtml}</div>
          <div class="tl-scale-row">
            <div style="flex:0 0 ${labelColPx}px; width:${labelColPx}px;"></div>
            <div class="tl-scale">
              ${todayMarkerHtml}
              <div class="tl-years">
                ${yearCellsHtml}
              </div>
              <div class="tl-months">
                ${monthCellsHtml}
              </div>
              <div style="position:relative; height:${milestoneLaneHeight}px;">
                <div class="tl-milestone-lane">${markerHtml}</div>
              </div>
            </div>
          </div>
          <div class="tl-rows">${rowsHtml}</div>
        </div>
        <div class="legend">
          <div class="legend-item"><svg width="16" height="10"><rect width="16" height="10" rx="2" fill="var(--st-complete)"/></svg> Completed</div>
          <div class="legend-item"><svg width="16" height="10"><rect width="16" height="10" rx="2" fill="var(--st-progress)"/></svg> In Progress</div>
          <div class="legend-item"><svg width="16" height="10"><rect width="16" height="10" rx="2" fill="var(--st-notstarted-bar)"/></svg> Future</div>
          <div class="legend-item"><svg width="16" height="10"><rect width="16" height="10" rx="2" fill="var(--st-behind)"/></svg> Behind Schedule</div>
          <div class="legend-item"><svg width="16" height="10"><rect width="16" height="10" rx="2" fill="var(--st-risk)"/></svg> At Risk</div>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- PPTX export ---------------- */
const PPTX_HEX = {
  ink:"1C2128", inkSoft:"6B7280", inkFaint:"A8ACB4",
  line:"E4E1D6", lineStrong:"D4D0C2", header:"1B2130",
  accent:"C98B2C", accentSoft:"F1E0BE", surface:"FFFFFF", paper:"F6F4EF",
  phase:"4C7A54", phaseTrack:"DCE7DD",
  milestone:"B0432E", major:"C98B2C",
  stNotstartedBar:"C7CBD2", stNotstartedTrack:"E3E5EA",
  stProgress:"2F6FB0", stProgressTrack:"D7E6F3",
  stComplete:"2B5D40", stCompleteTrack:"D6E5DB",
  stRisk:"B0432E", stRiskTrack:"F1DAD3",
  stBehind:"C98B2C", stBehindTrack:"F1E0BE"
};
function statusPptxColors(status){
  if(status==="complete") return { bar:PPTX_HEX.stComplete, track:PPTX_HEX.stCompleteTrack };
  if(status==="in-progress") return { bar:PPTX_HEX.stProgress, track:PPTX_HEX.stProgressTrack };
  if(status==="behind-schedule") return { bar:PPTX_HEX.stBehind, track:PPTX_HEX.stBehindTrack };
  if(status==="at-risk") return { bar:PPTX_HEX.stRisk, track:PPTX_HEX.stRiskTrack };
  return { bar:PPTX_HEX.stNotstartedBar, track:PPTX_HEX.stNotstartedTrack };
}
function pptxFileSafeName(s){
  return String(s).trim().replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g,"_") || "Timeline";
}

async function exportPptx(){
  const btn = document.getElementById("pptxBtn");
  if(typeof PptxGenJS === "undefined"){
    alert("The PowerPoint export library is still loading — please try again in a moment.");
    return;
  }
  const rows = allRows().filter(r=>r.row.visible);
  if(rows.length===0){
    alert("There's nothing visible on the timeline to export. Toggle the eye icon on the Data tab to show items first.");
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = "Generating…"; }

  try{
    let minDate=null, maxDate=null;
    rows.forEach(r=>{
      const s = parseD(r.row.start), e = parseD(r.row.end);
      if(!minDate || s<minDate) minDate=s;
      if(!maxDate || e>maxDate) maxDate=e;
    });
    const rangeStart = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    const rangeEnd = new Date(maxDate.getFullYear(), maxDate.getMonth()+1, 0);
    const totalMs = rangeEnd - rangeStart;
    const pct = (d)=> Math.max(0, Math.min(1, (d-rangeStart)/totalMs));

    const months = [];
    let cur = new Date(rangeStart);
    while(cur <= rangeEnd){ months.push(new Date(cur)); cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1); }
    const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    const pres = new PptxGenJS();
    pres.defineLayout({ name:"TL_WIDE", width:13.33, height:7.5 });
    pres.layout = "TL_WIDE";

    /* ---- single Gantt slide — every row scaled to fit on one slide ---- */
    const chartX = 2.9, chartW = 9.9, chartTop = 1.05, headerH = 0.3;
    const bottomMargin = 0.25;
    const availH = 7.5 - chartTop - headerH - bottomMargin;
    // PPTX export always uses the compact (halved) row spacing, regardless of the
    // on-screen Compact toggle, so exported decks stay dense and fit cleanly on one slide.
    const rowH = Math.max(0.045, Math.min(0.2, availH / rows.length));
    const fontScale = Math.max(0.45, Math.min(1, rowH/0.2));

    const slide = pres.addSlide();
    slide.background = { color: PPTX_HEX.surface };
    slide.addText(projectTitle, { x:0.5, y:0.22, w:11, h:0.45, fontSize:16, bold:true, color:PPTX_HEX.ink, fontFace:"Georgia" });

    // month header bar
    slide.addShape(pres.ShapeType.rect, { x:chartX, y:chartTop, w:chartW, h:headerH, fill:{color:PPTX_HEX.header}, line:{type:"none"} });
    months.forEach((m, idx)=>{
      const mStart = new Date(Math.max(m, rangeStart));
      const mEndRaw = new Date(m.getFullYear(), m.getMonth()+1, 0);
      const x0 = chartX + pct(mStart)*chartW;
      const x1 = chartX + pct(new Date(mEndRaw.getFullYear(), mEndRaw.getMonth(), mEndRaw.getDate()+1))*chartW;
      const w = Math.max(0.15, Math.min(x1,chartX+chartW) - x0);
      slide.addText(monthNames[m.getMonth()] + " '" + String(m.getFullYear()).slice(2), {
        x:x0, y:chartTop, w:w, h:headerH, fontSize:Math.max(6,7.5*fontScale), bold:true, color:"FFFFFF", align:"center", valign:"middle"
      });
      if(idx>0){
        slide.addShape(pres.ShapeType.line, { x:x0, y:chartTop, w:0, h: headerH + rows.length*rowH, line:{color:PPTX_HEX.line, width:0.5} });
      }
    });

    // rows
    let y = chartTop + headerH + 0.03;
    rows.forEach(r=>{
      const row = r.row;
      const isPhase = row.type==="phase";
      const s = parseD(row.start), e = parseD(row.end);
      const labelSize = Math.max(5, (isPhase ? 11 : 10)*fontScale);
      slide.addText(escapeAttrText(row.title), {
        x:0.35, y:y, w:chartX-0.5, h:rowH, fontSize:labelSize, bold:isPhase, color:PPTX_HEX.ink, valign:"middle", fontFace:"Segoe UI"
      });

      if(row.type==="phase" || row.type==="task"){
        const left = chartX + pct(s)*chartW;
        const right = chartX + pct(e)*chartW;
        const w = Math.max(0.1, right-left);
        const colors = isPhase ? { bar:PPTX_HEX.phase, track:PPTX_HEX.phaseTrack } : statusPptxColors(row.status);
        const barH = Math.max(0.06, Math.min(0.2, rowH*0.55)), barY = y + (rowH-barH)/2;
        slide.addShape(pres.ShapeType.roundRect, { x:left, y:barY, w:w, h:barH, rectRadius:0.03, fill:{color:colors.track}, line:{type:"none"} });
        const fillPct = Math.max(0, Math.min(100, row.percent||0))/100;
        if(fillPct>0){
          slide.addShape(pres.ShapeType.roundRect, { x:left, y:barY, w:Math.max(0.04,w*fillPct), h:barH, rectRadius:0.03, fill:{color:colors.bar}, line:{type:"none"} });
        }
        if(rowH>=0.16){
          slide.addText(fmtShort(s) + " – " + fmtShort(e), { x:Math.min(right+0.06, chartX+chartW-1.6), y:y, w:1.6, h:rowH, fontSize:Math.max(5,7*fontScale), color:PPTX_HEX.inkSoft, valign:"middle" });
        }
      } else {
        const x = chartX + pct(s)*chartW;
        const shapeType = row.type==="major" ? pres.ShapeType.star5 : pres.ShapeType.diamond;
        const color = row.type==="major" ? PPTX_HEX.major : PPTX_HEX.milestone;
        const size = Math.max(0.07, Math.min(0.14, rowH*0.5));
        slide.addShape(shapeType, { x:x-size/2, y:y+(rowH-size)/2, w:size, h:size, fill:{color:color}, line:{type:"none"} });
        if(rowH>=0.16){
          slide.addText(fmtShort(s), { x:x+0.1, y:y, w:1.4, h:rowH, fontSize:Math.max(5,7*fontScale), color:PPTX_HEX.inkSoft, valign:"middle" });
        }
      }
      y += rowH;
    });

    // today line
    const today = new Date();
    if(today>=rangeStart && today<=rangeEnd){
      const tx = chartX + pct(today)*chartW;
      slide.addShape(pres.ShapeType.line, { x:tx, y:chartTop+headerH, w:0, h:y-(chartTop+headerH), line:{color:PPTX_HEX.milestone, width:1, dashType:"solid"} });
      slide.addText("Today", { x:tx-0.4, y:chartTop-0.02, w:0.8, h:0.2, fontSize:7, bold:true, color:PPTX_HEX.milestone, align:"center" });
    }

    pres.writeFile({ fileName: pptxFileSafeName(projectTitle) + ".pptx" });
  } catch(err){
    console.error(err);
    alert("Something went wrong generating the PowerPoint file. Please try again.");
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = "⬇ Export PPTX"; }
  }
}
function escapeAttrText(s){ return String(s); }

boot();
</script>
